<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard - Top Zokro Players Worldwide</title>
<meta name="description" content="Top Zokro players worldwide across Desert Daily, Stack the Dune 3D and Guess the Oasis. Play daily and climb the ranks!">
<link rel="canonical" href="https://zokro.fun/en/leaderboard.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Zokro">
<meta property="og:title" content="Leaderboard - Top Zokro Players Worldwide">
<meta property="og:description" content="Top Zokro players worldwide. Play daily and climb the ranks!">
<meta property="og:url" content="https://zokro.fun/en/leaderboard.html">
<meta property="og:image" content="https://zokro.fun/assets/social-cover.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0a0714">
<link rel="stylesheet" href="../assets/style.css?v=3">
<style>
.wrap{max-width:680px;margin:auto;padding:20px}
.backpill{display:inline-block;text-decoration:none;font-size:13px;font-weight:800;color:#f5c451;border:1px solid #f5c45155;background:#f5c4510d;padding:8px 18px;border-radius:20px;margin-bottom:12px}
.backpill:hover{background:#f5c45122}
h1{margin:6px 0 2px;font-size:30px}
.sub{color:#b8aed6;font-size:14px;margin:0 0 16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{background:#0d1531;color:#fff;border:1px solid #263154;border-radius:24px;padding:10px 18px;cursor:pointer;font-size:14px;font-weight:700;transition:.15s}
.tabs button:hover{border-color:#f5c451;transform:translateY(-2px)}
.tabs button.on{background:linear-gradient(90deg,#f5c451,#ff8a3d);color:#1a1000;font-weight:800;border:0}
table{width:100%;border-collapse:collapse;background:#151d33;border:1px solid #263154;border-radius:16px;overflow:hidden}
thead th{background:#f5c45114;color:#f5c451;font-size:12px;text-transform:uppercase;letter-spacing:1px}
td,th{padding:12px;border-bottom:1px solid #263154;font-size:14px;text-align:left}
td:first-child,th:first-child{text-align:center;width:56px}
td:last-child,th:last-child{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f5c4510d}
tr.me{background:#f5c45114;box-shadow:inset 3px 0 0 #f5c451}
.medal{font-size:17px;font-weight:900;color:#b8aed6}
.medal.g{color:#f5c451}
.emptycell{text-align:center!important;padding:24px!important}
.btn-gold{display:inline-block;background:linear-gradient(90deg,#f5c451,#ff8a3d);color:#1a1000!important;font-weight:800;border:0;border-radius:12px;padding:10px 22px;cursor:pointer;font-size:14px;text-decoration:none;margin-top:8px}
.note{color:#b8aed6;font-size:13px;margin-top:14px;text-align:center}
.note b{color:#f5c451}
</style>
</head>
<body>
<nav class="nav"><a class="logo" href="./">ZOK<b>RO</b></a><div id="langmenu" data-base="../"></div><script src="../assets/langs.js?v=15"></script></nav>
<div class="wrap">
<a href="./" class="backpill">← Home</a>
<h1>🌍 Leaderboard</h1>
<p class="sub">Top players worldwide — updated live after every game.</p>
<div class="tabs">
<button class="on" onclick="load('Desert Daily',this)">💧 Desert Daily</button><button onclick="load('Stack the Dune 3D',this)">🧱 Stack 3D</button><button onclick="load('Guess the Oasis',this)">🌴 Oasis</button>
</div>
<table id="lb"><thead><tr><th>#</th><th>Player</th><th>Score</th></tr></thead><tbody id="lbBody"><tr><td colspan="3" class="emptycell">⏳ Loading...</td></tr></tbody></table>
<p class="note" id="lbNote">Log in to save your scores and appear here!</p>
</div>
<footer><p class="copy">© 2026 Zokro</p></footer>
<script src="../assets/auth.js?v=3"></script>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function avh(av,nm){av=av||'';if(/^data:image|^https?:\/\//i.test(av))return '<img src="'+av+'" alt="" style="width:28px;height:28px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-inline-end:8px">';if(av&&av!=='🎮')return '<span style="margin-inline-end:8px">'+esc(av)+'</span>';var ch=(((nm||'?').trim().charAt(0))||'?').toUpperCase();return '<span class="zk-avinit" style="width:28px;height:28px;font-size:14px;margin-inline-end:8px">'+esc(ch)+'</span>';}
function medal(i){if(i===0)return '<span class="medal g">🥇</span>';if(i===1)return '<span class="medal">🥈</span>';if(i===2)return '<span class="medal">🥉</span>';return '<span class="medal">'+(i+1)+'</span>';}
var uid=null;
function load(game,btn){
  document.querySelectorAll('.tabs button').forEach(function(b){b.classList.remove('on');});
  if(btn)btn.classList.add('on');
  var tb=document.getElementById('lbBody');
  tb.innerHTML='<tr><td colspan="3" class="emptycell">⏳ Loading...</td></tr>';
  var iv=setInterval(function(){
    if(!window.zkAuth||!window.zkAuth.ready)return;clearInterval(iv);
    uid=window.zkAuth.user?window.zkAuth.user.id:null;
    var note=document.getElementById('lbNote');
    note.innerHTML=uid?'✅ Logged in — your scores save automatically after each game.':'🔒 <b>Log in</b> to save your scores and appear here!';
    window.zkAuth.client.from('scores').select('score,user_id,profiles(username,avatar)').eq('game',game).order('score',{ascending:false}).limit(20).then(function(r){
      if(r.error){tb.innerHTML='<tr><td colspan="3" class="emptycell">⚠️ '+esc(r.error.message)+'</td></tr>';return;}
      var rows=r.data||[];
      if(!rows.length){tb.innerHTML='<tr><td colspan="3" class="emptycell">No scores yet — be the first!<br><a class="btn-gold" href="./">Play now →</a></td></tr>';return;}
      tb.innerHTML='';
      rows.forEach(function(s,i){
        var p=s.profiles||{username:'?',avatar:''};
        var me=uid&&s.user_id===uid;
        tb.innerHTML+='<tr'+(me?' class="me"':'')+'><td>'+medal(i)+'</td><td>'+avh(p.avatar,p.username)+esc(p.username)+(me?' <b style="color:#f5c451">(you)</b>':'')+'</td><td>'+parseInt(s.score||0)+'</td></tr>';
      });
    });
  },400);
}
load('Desert Daily');
</script>
</body>
</html>

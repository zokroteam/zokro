<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile - Zokro</title>
<meta name="description" content="Your Zokro player profile: avatar, name, streak and best scores across all games.">
<link rel="canonical" href="https://zokro.fun/en/profile.html">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0714">
<link rel="stylesheet" href="../assets/style.css?v=7">
<style>
.wrap{max-width:680px;margin:auto;padding:20px}
.pcard{background:#151d33;border:1px solid #263154;border-radius:22px;overflow:hidden;text-align:center;box-shadow:0 24px 60px #00000066}
.pbanner{height:120px;background:linear-gradient(120deg,#2a1540,#7c3aed 40%,#ff8a3d 75%,#f5c451);position:relative;overflow:hidden}
.pbanner::before{content:'';position:absolute;bottom:-42px;left:-10%;right:-10%;height:84px;background:radial-gradient(60% 100% at 30% 100%,#f5c45177,transparent),radial-gradient(50% 100% at 70% 100%,#ff8a3d77,transparent);border-radius:50% 50% 0 0}
.pbanner::after{content:'';position:absolute;top:-50px;right:-30px;width:170px;height:170px;background:radial-gradient(circle,#ffffff2e,transparent 70%)}
.backpill{display:inline-block;text-decoration:none;font-size:13px;font-weight:800;color:#f5c451;border:1px solid #f5c45155;background:#f5c4510d;padding:8px 18px;border-radius:20px;margin-bottom:12px}
.backpill:hover{background:#f5c45122}
.pavatar{margin-top:-56px;display:flex;justify-content:center;position:relative;z-index:2}
.pav{font-size:64px;line-height:104px;width:104px;height:104px;border-radius:50%;background:#0d1531;border:3px solid #f5c451;box-shadow:0 0 0 4px #f5c45133,0 10px 30px #00000088}
.pavimg{width:104px;height:104px;border-radius:50%;object-fit:cover;border:3px solid #f5c451;box-shadow:0 0 0 4px #f5c45133,0 10px 30px #00000088;background:#0d1531}
.pavinit{width:104px;height:104px;border-radius:50%;background:linear-gradient(135deg,#f5c451,#ff8a3d);color:#1a1000;font-size:46px;font-weight:900;display:flex;align-items:center;justify-content:center;border:3px solid #ffe9a8;box-shadow:0 0 24px #f5c45155,0 10px 30px #00000088}
.pname{margin:10px 0 2px;font-size:26px;letter-spacing:.5px}
.pmail{color:#b8aed6;margin:0 0 4px;font-size:13px}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 18px 4px}
.stat{background:#0d1531;border:1px solid #263154;border-radius:14px;padding:12px 6px}
.stat b{display:block;font-size:22px;color:#f5c451}
.stat span{font-size:11.5px;color:#b8aed6}
.pedit{padding:12px 18px 4px}
#pname{font-size:15px;padding:11px 14px;border-radius:12px;border:1px solid #263154;background:#0d1531;color:#fff;width:62%;max-width:280px;outline:none}
#pname:focus{border-color:#f5c451}
.btn-gold{background:linear-gradient(90deg,#f5c451,#ff8a3d);color:#1a1000;font-weight:800;border:0;border-radius:12px;padding:11px 20px;cursor:pointer;font-size:14px}
.btn-gold:disabled,.btn-ghost:disabled{opacity:.6;cursor:wait}
.btn-ghost{background:transparent;color:#b8aed6;border:1px solid #263154;border-radius:12px;padding:10px 18px;cursor:pointer;font-size:14px}
.pick{margin:12px 0 4px}
.pick button{font-size:24px;background:#0d1531;border:1px solid #263154;border-radius:12px;padding:6px 10px;margin:3px;cursor:pointer;transition:.15s}
.pick button:hover{transform:translateY(-2px);border-color:#f5c451}
.pick button.on{border-color:#f5c451;box-shadow:0 0 0 2px #f5c45155}
.uprow{margin:10px 0 4px}
.uprow input[type=file]{display:none}
.frrow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#0d1531;border:1px solid #263154;border-radius:12px;padding:8px 12px;margin:6px 0;font-size:14px}
#pmsg{font-size:13px;color:#f5c451;min-height:20px;font-weight:700}
table{width:100%;margin-top:14px;border-collapse:collapse;background:#151d33;border:1px solid #263154;border-radius:16px;overflow:hidden}
thead th{background:#f5c45114;color:#f5c451;font-size:12px;text-transform:uppercase;letter-spacing:1px}
td,th{padding:11px 12px;border-bottom:1px solid #263154;font-size:14px;text-align:left}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f5c4510d}
.rank1{color:#f5c451;font-weight:900}
.secttl{display:flex;align-items:center;gap:8px;margin:22px 2px 0}
</style>
</head>
<body>
<nav class="nav"><a class="logo" href="./">ZOK<b>RO</b></a><div id="langmenu" data-base="../"></div><script src="../assets/langs.js?v=20"></script></nav>
<div class="wrap">
<a href="./" class="backpill">← Home</a>
<div class="pcard" id="pcard"><p style="padding:30px">⏳ Loading your profile...</p></div>
<div class="secttl"><h3 style="margin:0">🏆 My best scores</h3></div>
<table id="scores"><thead><tr><th>Game</th><th>Score</th><th>Date</th></tr></thead><tbody id="scoresBody"></tbody></table>
<p><a class="btn-gold" style="text-decoration:none;display:inline-block" href="leaderboard.html">🌍 Global leaderboard →</a></p>
<div class="secttl" id="frsec"><h3 style="margin:0">👥 Friends</h3></div>
<div class="pcard" style="margin-top:12px;padding:20px" id="fcard"><p>⏳ Loading friends...</p></div>
<div class="secttl"><h3 style="margin:0">❤️ Liked games</h3></div>
<div class="grid" id="likedGrid" style="margin-top:12px"></div>
<p><button class="btn-ghost" onclick="logout()">Log out</button></p>
</div>
<footer><p class="copy">© 2026 Zokro</p></footer>
<script src="../assets/auth.js?v=3"></script>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function avHTML(av,name){
  av=av||'';
  if(/^data:image|^https?:\/\//i.test(av))return '<img class="pavimg" src="'+av+'" alt="avatar">';
  if(av&&av!=='🎮')return '<div class="pav">'+esc(av)+'</div>';
  var ch=((name||'P').trim().charAt(0)||'P').toUpperCase();
  return '<div class="pavinit">'+esc(ch)+'</div>';
}
function logout(){if(window.zkAuth&&window.zkAuth.ready)window.zkAuth.client.auth.signOut().then(function(){location.href='./';});else location.href='./';}
function localAv(){try{return localStorage.getItem('zk_avatar')||'';}catch(e){return '';}}
function localStreak(){try{return parseInt(localStorage.getItem('zk_streak')||'0');}catch(e){return 0;}}
function pmsg(t){var m=document.getElementById('pmsg');if(m)m.textContent=t||'';}
var iv=setInterval(function(){
  if(!window.zkAuth||!window.zkAuth.ready)return;
  clearInterval(iv);
  var sb=window.zkAuth.client;
  sb.auth.getSession().then(function(sr){
    var u=(sr.data&&sr.data.session&&sr.data.session.user)||window.zkAuth.user;
    if(!u){document.getElementById('pcard').innerHTML='<p style="padding:30px;font-size:17px">🔒<br><br><a href="./">Log in from the homepage</a> to see your profile.<br><span style="color:#b8aed6;font-size:13px">Playing stays free — no account needed.</span></p>';return;}
    window.zkAuth.user=u;
    loadProfile(sb,u);
    loadScores(sb,u);
    loadFriends(sb,u.id);
  });
},500);
function loadProfile(sb,u){
  sb.from('profiles').select('*').eq('id',u.id).single().then(function(r){
    if(r.error&&r.error.code!=='PGRST116'){document.getElementById('pcard').innerHTML='<p style="padding:30px">⚠️ Could not load profile: '+esc(r.error.message)+'<br><br><button class="btn-ghost" onclick="location.reload()">Retry</button></p>';return;}
    var p=r.data||{username:'Player',avatar:'🎮'};
    var la=localAv();
    if(la&&p.avatar!==la){p.avatar=la;sb.from('profiles').update({avatar:la}).eq('id',u.id).then(function(){});}
    var av=p.avatar||la||'🎮';
    var name=p.username||'Player';
    var since='—';try{since=u.created_at?new Date(u.created_at).toLocaleDateString():'—';}catch(e){}
    var emos=['🎮','🔥','🌴','💧','🧱','🐪','⚡','👑'];
    document.getElementById('pcard').innerHTML=
      '<div class="pbanner"></div><div class="pavatar">'+avHTML(av,name)+'</div>'
      +'<h2 class="pname">'+esc(name)+'</h2>'
      +'<p class="pmail">'+esc(u.email||'')+' • joined '+esc(since)+'</p>'
      +'<div class="pstats"><div class="stat"><b>🔥 '+localStreak()+'</b><span>day streak</span></div>'
      +'<div class="stat"><b id="st-games">0</b><span>games played</span></div>'
      +'<div class="stat"><b id="st-best">0</b><span>best score</span></div></div>'
      +'<div class="pedit"><input id="pname" maxlength="20" value="'+esc(name)+'"> <button class="btn-gold" id="saveBtn" onclick="saveName()">Save</button></div>'
      +'<div class="pick">'+emos.map(function(e){return '<button class="'+(av===e?'on':'')+'" onclick="setAv(\''+e+'\')">'+e+'</button>';}).join('')+'</div>'
      +'<div class="uprow"><label class="btn-ghost" style="display:inline-block;cursor:pointer">📷 Upload photo<input type="file" accept="image/*" onchange="upPhoto(this)"></label></div>'
      +'<p id="pmsg"></p>';
  });
}
function loadScores(sb,u){
  sb.from('scores').select('game,score,created_at').eq('user_id',u.id).order('score',{ascending:false}).limit(100).then(function(r){
    var tb=document.getElementById('scoresBody');
    if(r.error){tb.innerHTML='<tr><td colspan="3">⚠️ '+esc(r.error.message)+'</td></tr>';return;}
    var rows=r.data||[];
    if(!rows.length){tb.innerHTML='<tr><td colspan="3" style="text-align:center;padding:20px">No scores yet — <a href="./" style="color:#f5c451;font-weight:800">go play →</a></td></tr>';return;}
    var games={},best=0;
    rows.forEach(function(s){games[s.game]=1;if(s.score>best)best=s.score;});
    document.getElementById('st-games').textContent=Object.keys(games).length;
    document.getElementById('st-best').textContent=best;
    rows.slice(0,10).forEach(function(s,i){
      var d='—';try{d=new Date(s.created_at).toLocaleDateString();}catch(e){}
      tb.innerHTML+='<tr><td>'+(i===0?'<span class="rank1">🥇 ':'')+esc(s.game)+(i===0?'</span>':'')+'</td><td>'+parseInt(s.score||0)+'</td><td>'+esc(d)+'</td></tr>';
    });
  });
}
function saveName(){
  var b=document.getElementById('saveBtn');
  var v=document.getElementById('pname').value.trim().slice(0,20);
  if(!v){pmsg('⚠️ Name cannot be empty');return;}
  b.disabled=true;pmsg('⏳ Saving...');
  window.zkAuth.client.from('profiles').update({username:v}).eq('id',window.zkAuth.user.id).then(function(r){
    b.disabled=false;
    if(r.error){pmsg('❌ '+r.error.message);return;}
    pmsg('✅ Name saved!');
    setTimeout(function(){location.reload();},600);
  });
}
function setAv(e){
  pmsg('⏳ Saving avatar...');
  try{localStorage.removeItem('zk_avatar');}catch(x){}
  window.zkAuth.client.from('profiles').update({avatar:e}).eq('id',window.zkAuth.user.id).then(function(r){
    if(r.error){pmsg('❌ '+r.error.message);return;}
    pmsg('✅ Avatar saved!');
    setTimeout(function(){location.reload();},600);
  });
}
function upPhoto(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  if(f.size>5*1024*1024){pmsg('⚠️ Image too big (max 5MB)');inp.value='';return;}
  pmsg('⏳ Uploading photo...');
  var rd=new FileReader();
  rd.onload=function(){
    var img=new Image();
    img.onload=function(){
      try{
        var s=128,c=document.createElement('canvas');c.width=s;c.height=s;
        var ctx=c.getContext('2d'),a=Math.min(img.width,img.height);
        ctx.drawImage(img,(img.width-a)/2,(img.height-a)/2,a,a,0,0,s,s);
        var url=c.toDataURL('image/jpeg',0.82);
        try{localStorage.setItem('zk_avatar',url);}catch(e){}
        window.zkAuth.client.from('profiles').update({avatar:url}).eq('id',window.zkAuth.user.id).then(function(r){
          if(r.error){pmsg('❌ '+r.error.message);return;}
          pmsg('✅ Photo saved!');
          setTimeout(function(){location.reload();},600);
        });
      }catch(e){pmsg('❌ Could not read that image');}
    };
    img.onerror=function(){pmsg('❌ Could not read that image');};
    img.src=rd.result;
  };
  rd.readAsDataURL(f);
}
function avMini(av){if(av&&/^data:image|^https?:\/\//i.test(av))return '<img src="'+av+'" alt="" style="width:28px;height:28px;border-radius:50%;object-fit:cover;vertical-align:middle">';if(av&&av!=='🎮')return esc(av);return '<span class="zk-avinit" style="width:28px;height:28px;font-size:13px">?</span>';}
function loadFriends(sb,me){
  var box=document.getElementById('fcard');if(!box)return;
  sb.from('friendships').select('*').or('user_id.eq.'+me+',friend_id.eq.'+me).then(function(r){
    if(r.error){box.innerHTML='<p>⚠️ '+esc(r.error.message)+'</p>';return;}
    var rows=r.data||[];
    var incoming=rows.filter(function(x){return x.friend_id===me&&x.status==='pending';});
    var accepted=rows.filter(function(x){return x.status==='accepted';});
    var ids=[];
    accepted.forEach(function(x){var f=x.user_id===me?x.friend_id:x.user_id;if(ids.indexOf(f)<0)ids.push(f);});
    incoming.forEach(function(x){if(ids.indexOf(x.user_id)<0)ids.push(x.user_id);});
    var profs={};
    function render(){
      var h='<div style="display:flex;gap:8px;margin-bottom:10px"><input id="frname" maxlength="20" placeholder="Add by username..." style="flex:1;min-width:0;font-size:14px;padding:10px;border-radius:12px;border:1px solid #263154;background:#0d1531;color:#fff;outline:none"> <button class="btn-gold" onclick="frAdd()">Add</button></div><p id="frmsg" style="font-size:13px;color:#f5c451;min-height:18px"></p>';
      if(incoming.length){h+='<h4 style="margin:8px 0;color:#f5c451">Requests ('+incoming.length+')</h4>';incoming.forEach(function(x){var p=profs[x.user_id]||{username:'?'};h+='<div class="frrow"><span>'+avMini(p.avatar)+' '+esc(p.username)+'</span><span><button class="btn-gold" style="padding:6px 12px" onclick="frAccept('+x.id+')">✓</button> <button class="btn-ghost" style="padding:6px 12px" onclick="frDel('+x.id+')">✕</button></span></div>';});}
      h+='<h4 style="margin:10px 0 4px;color:#f5c451">My friends ('+accepted.length+')</h4>';
      if(!accepted.length)h+='<p style="color:#b8aed6;font-size:13px">No friends yet — add players from the leaderboard! 🌍</p>';
      accepted.forEach(function(x){var fid=x.user_id===me?x.friend_id:x.user_id;var p=profs[fid]||{username:'?'};h+='<div class="frrow"><span>'+avMini(p.avatar)+' '+esc(p.username)+'</span><button class="btn-ghost" style="padding:6px 12px" onclick="frDel('+x.id+')">Remove</button></div>';});
      box.innerHTML=h;
    }
    if(!ids.length){render();return;}
    sb.from('profiles').select('id,username,avatar').in('id',ids).then(function(r2){
      (r2.data||[]).forEach(function(p){profs[p.id]=p;});
      render();
    });
  });
}
function frMsg(t){var m=document.getElementById('frmsg');if(m)m.textContent=t||'';}
function frAdd(){
  var v=document.getElementById('frname').value.trim();
  if(!v){frMsg('⚠️ Type a username');return;}
  var sb=window.zkAuth.client,me=window.zkAuth.user.id;
  sb.from('profiles').select('id,username').eq('username',v).single().then(function(r){
    if(r.error||!r.data){frMsg('❌ Player not found');return;}
    if(r.data.id===me){frMsg('⚠️ That is you!');return;}
    sb.from('friendships').insert({user_id:me,friend_id:r.data.id,status:'pending'}).then(function(r2){
      if(r2.error){frMsg(r2.error.code==='23505'?'✅ Already requested or friends':'❌ '+r2.error.message);return;}
      frMsg('✅ Request sent to '+v+'!');
      setTimeout(function(){loadFriends(sb,me);},800);
    });
  });
}
function frAccept(id){var sb=window.zkAuth.client,me=window.zkAuth.user.id;sb.from('friendships').update({status:'accepted'}).eq('id',id).then(function(){loadFriends(sb,me);});}
function frDel(id){var sb=window.zkAuth.client,me=window.zkAuth.user.id;sb.from('friendships').delete().eq('id',id).then(function(){loadFriends(sb,me);});}
(function renderLiked(){
  var g=document.getElementById('likedGrid');if(!g)return;
  var f=[];try{f=JSON.parse(localStorage.getItem('zk_fav')||'[]');}catch(e){}
  var h='';
  f.forEach(function(x){
    var o=(typeof x==='string')?{u:x}:x;
    if(o.html)h+=o.html;
    else h+='<a class="card" href="'+o.u+'"><div class="cbody"><h3>🎮 Saved game</h3><p><span class="go">Play →</span></p></div></a>';
  });
  g.innerHTML=h||'<p style="color:#b8aed6;font-size:13px">No liked games yet — tap 🤍 on any game!</p>';
  try{if(window.paintFavs)window.paintFavs();}catch(e){}
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile - Zokro</title>
<meta name="description" content="Your Zokro player profile: avatar, name, streak and best scores across all games.">
<link rel="canonical" href="https://zokro.fun/en/profile.html">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0714">
<link rel="stylesheet" href="../assets/style.css">
<style>
.wrap{max-width:640px;margin:auto;padding:20px}
.pcard{background:#151d33;border:1px solid #263154;border-radius:18px;padding:26px;text-align:center}
.pav{font-size:72px;line-height:1.2}
.pavimg{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid #f5c451}
.pick{margin-top:12px}
.pick button{font-size:26px;background:#0d1531;border:1px solid #263154;border-radius:12px;padding:6px 10px;margin:3px;cursor:pointer}
.pick button.on{border-color:#f5c451;box-shadow:0 0 0 2px #f5c45155}
#pname{font-size:16px;padding:10px;border-radius:12px;border:1px solid #263154;background:#0d1531;color:#fff;width:70%;max-width:300px}
.btn-gold{background:linear-gradient(90deg,#f5c451,#ff8a3d);color:#1a1000;font-weight:800;border:0;border-radius:12px;padding:10px 18px;cursor:pointer;font-size:14px}
.btn-ghost{background:transparent;color:#b8aed6;border:1px solid #263154;border-radius:12px;padding:10px 18px;cursor:pointer;font-size:14px}
table{width:100%;margin-top:14px;border-collapse:collapse;background:#151d33;border:1px solid #263154;border-radius:14px;overflow:hidden}
td,th{padding:9px;border-bottom:1px solid #263154;font-size:14px;text-align:left}
.streakline{margin:6px 0 0;color:#f5c451;font-weight:800}
.uprow{margin-top:12px}
.uprow input[type=file]{display:none}
#amsg{font-size:13px;color:#f5c451;min-height:18px}
</style>
</head>
<body>
<nav class="nav"><a class="logo" href="./">ZOK<b>RO</b></a><div id="langmenu" data-base="../"></div><script src="../assets/langs.js?v=14"></script></nav>
<div class="wrap">
<a href="./">← Home</a>
<div class="pcard" id="pcard"><p>⏳ Loading your profile...</p></div>
<h3>🏆 My best scores</h3>
<table id="scores"><tr><th>Game</th><th>Score</th><th>Date</th></tr></table>
<p><a href="leaderboard.html">🌍 Global leaderboard →</a></p>
<p><button class="btn-ghost" onclick="logout()">Log out</button></p>
</div>
<footer><p class="copy">© 2026 Zokro</p></footer>
<script src="../assets/auth.js?v=2"></script>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function avHTML(av){
  av=av||'🎮';
  if(/^data:image|^https?:\/\//i.test(av))return '<img class="pavimg" src="'+av+'" alt="avatar">';
  return '<div class="pav">'+esc(av)+'</div>';
}
function logout(){if(window.zkAuth&&window.zkAuth.ready)window.zkAuth.client.auth.signOut().then(function(){location.href='./';});else location.href='./';}
function localAv(){try{return localStorage.getItem('zk_avatar')||'';}catch(e){return '';}}
function localStreak(){try{return parseInt(localStorage.getItem('zk_streak')||'0');}catch(e){return 0;}}
var iv=setInterval(function(){
  if(!window.zkAuth||!window.zkAuth.ready)return;
  clearInterval(iv);
  var u=window.zkAuth.user;
  if(!u){document.getElementById('pcard').innerHTML='<p style="font-size:20px">🔒</p><p><a href="./">Log in from the homepage</a> to see your profile.<br>Playing stays free — no account needed.</p>';return;}
  var sb=window.zkAuth.client;
  sb.from('profiles').select('*').eq('id',u.id).single().then(function(r){
    var p=r.data||{username:'Player',avatar:'🎮'};
    // If a photo was picked while logged out, push it to the account now
    var la=localAv();
    if(la&&p.avatar!==la){p.avatar=la;sb.from('profiles').update({avatar:la}).eq('id',u.id).then(function(){});}
    var av=p.avatar||la||'🎮';
    var name=p.username||'Player';
    var since='';try{since=u.created_at?new Date(u.created_at).toLocaleDateString():'—';}catch(e){since='—';}
    var emos=['🎮','🔥','🌴','💧','🧱','🐪','⚡','👑'];
    document.getElementById('pcard').innerHTML=
      avHTML(av)+'<h2 style="margin:8px 0 2px">'+esc(name)+'</h2>'
      +'<p style="color:#b8aed6;margin:0 0 4px">'+esc(u.email||'')+' • joined '+esc(since)+'</p>'
      +'<p class="streakline">🔥 '+localStreak()+' day streak</p>'
      +'<div style="margin-top:12px"><input id="pname" maxlength="20" value="'+esc(name)+'"> <button class="btn-gold" onclick="saveName()">Save name</button></div>'
      +'<div class="pick">'+emos.map(function(e){return '<button class="'+(av===e?'on':'')+'" onclick="setAv(\''+e+'\')">'+e+'</button>';}).join('')+'</div>'
      +'<div class="uprow"><label class="btn-ghost" style="display:inline-block;cursor:pointer">📷 Upload photo<input type="file" accept="image/*" onchange="upPhoto(this)"></label></div>'
      +'<p id="amsg"></p>';
  });
  sb.from('scores').select('game,score,created_at').eq('user_id',u.id).order('score',{ascending:false}).limit(10).then(function(r){
    var rows=r.data||[];
    if(!rows.length){document.getElementById('scores').innerHTML+='<tr><td colspan="3">No scores yet — go play! 🎮</td></tr>';return;}
    rows.forEach(function(s){
      var d='—';try{d=new Date(s.created_at).toLocaleDateString();}catch(e){}
      document.getElementById('scores').innerHTML+='<tr><td>'+esc(s.game)+'</td><td>'+parseInt(s.score||0)+'</td><td>'+esc(d)+'</td></tr>';
    });
  });
},500);
function saveName(){
  var v=document.getElementById('pname').value.trim().slice(0,20)||'Player';
  window.zkAuth.client.from('profiles').update({username:v}).eq('id',window.zkAuth.user.id).then(function(){location.reload();});
}
function setAv(e){
  try{localStorage.removeItem('zk_avatar');}catch(x){}
  window.zkAuth.client.from('profiles').update({avatar:e}).eq('id',window.zkAuth.user.id).then(function(){location.reload();});
}
function upPhoto(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  var msg=function(t){var m=document.getElementById('amsg');if(m)m.textContent=t;};
  if(f.size>5*1024*1024){msg('⚠️ Image too big (max 5MB)');return;}
  msg('⏳ Uploading...');
  var rd=new FileReader();
  rd.onload=function(){
    var img=new Image();
    img.onload=function(){
      try{
        var s=128,c=document.createElement('canvas');c.width=s;c.height=s;
        var ctx=c.getContext('2d'),a=Math.min(img.width,img.height);
        ctx.drawImage(img,(img.width-a)/2,(img.height-a)/2,a,a,0,0,s,s);
        var url=c.toDataURL('image/jpeg',0.82);
        try{localStorage.setItem('zk_avatar',url);}catch(e){}
        window.zkAuth.client.from('profiles').update({avatar:url}).eq('id',window.zkAuth.user.id).then(function(){location.reload();});
      }catch(e){msg('❌ Could not read that image');}
    };
    img.onerror=function(){msg('❌ Could not read that image');};
    img.src=rd.result;
  };
  rd.readAsDataURL(f);
}
</script>
</body>
</html>

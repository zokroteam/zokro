<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Desert Daily - Play</title>
<style>body{font-family:system-ui;margin:0;background:#faf3e3;color:#3b2f1d;text-align:center;padding:12px}.bar{height:16px;background:#e5dcc8;border-radius:8px;overflow:hidden;margin:6px auto;max-width:420px}.bar>div{height:100%;background:#2f9e44}.bar.heat>div{background:#e8590c}button{font-size:16px;padding:10px 16px;margin:5px;border-radius:10px;border:0;background:#1971c2;color:#fff;cursor:pointer}</style>
</head>
<body>
<h2>💧 <span data-t="game_name">Desert Daily</span> #<span id="dayNum"></span></h2>
<div><span data-t="water">Water</span><div class="bar"><div id="waterBar" style="width:100%"></div></div></div>
<div><span data-t="heat">Heat</span>: <span id="heat">40</span>°C<div class="bar heat"><div id="heatBar" style="width:30%"></div></div></div>
<div><span data-t="time">Time</span>: <span id="time">60</span><span data-t="sec">s</span> • <span data-t="score">Score</span>: <span id="score">0</span></div>
<div><button onclick="give()">💧 <span data-t="drink">Drink</span></button><button onclick="shade()">⛱️ <span data-t="shade">Shade</span></button><button onclick="rest()">😴 <span data-t="rest">Rest</span></button></div>
<p id="result"></p>
<button onclick="share()">📋 <span data-t="lvl_copy">Copy result</span></button>
<script src="../../assets/game-i18n.js"></script>
<script>
const T=function(k){try{if(window.zkT)return window.zkT('desert',k);}catch(e){}return k;};
const dayNum=Math.floor(Date.now()/86400000);
document.getElementById('dayNum').textContent=dayNum;
let seed=dayNum%100;function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
let water=100,heat=40+rnd()*5,time=60,score=0,over=false;
const timer=setInterval(()=>{if(over)return;time--;heat+=0.4+rnd()*0.4;water-=(heat-35)*0.12;if(time<=0||water<=0){end();}update();},1000);
function update(){document.getElementById('waterBar').style.width=Math.max(0,water)+'%';document.getElementById('heatBar').style.width=Math.min(100,(heat-30)*3)+'%';document.getElementById('heat').textContent=Math.round(heat);document.getElementById('time').textContent=Math.max(0,time);document.getElementById('score').textContent=Math.round(score);}
function give(){if(over)return;if(score>=5){water=Math.min(100,water+8);score-=5;}update();}
function shade(){if(over)return;if(water>=10){water-=10;heat-=4;score+=5;}update();}
function rest(){if(over)return;heat+=2;score+=15;update();}
function end(){over=true;clearInterval(timer);const win=time<=0&&water>0;const final=Math.round(score+(win?Math.max(0,water):0));document.getElementById('result').textContent=win?(T('survived')+' '+T('result_score')+' '+final+' 🟩🟩🟩🟩🟩'):(T('dried')+' '+T('result_score')+' '+final+' 🟥🟥⬜⬜⬜');update();zkPush('Desert Daily',final);}
function zkPush(g,s){try{const k='zk_best_'+g;if(s>parseInt(localStorage.getItem(k)||'0'))localStorage.setItem(k,String(s));if(parent&&parent.zkSaveScore)parent.zkSaveScore(g,s);}catch(e){}}
function share(){const t='🏜️ '+T('game_name')+' #'+dayNum+' - '+T('result_score')+' '+Math.round(score+Math.max(0,water))+' - '+T('sharePlay')+' https://zokro.fun';navigator.clipboard.writeText(t);alert(T('lvl_copied'));}
zkApplyI18n('desert');
update();
</script>
</body>
</html>

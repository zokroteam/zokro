<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Stack the Dune 3D - Play</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#f4e3c1;font-family:system-ui}#ui{position:fixed;top:8px;left:0;right:0;text-align:center;pointer-events:none;color:#5c3d0a}#ui b{font-size:22px}#btn{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:20px;padding:12px 44px;border:0;border-radius:30px;background:#e07b39;color:#fff;cursor:pointer}#msg{position:fixed;bottom:70px;left:0;right:0;text-align:center;font-weight:700;color:#5c3d0a}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.min.js"></script>
</head>
<body>
<div id="ui">🧱 Level <b id="lvl">0</b>/12</div>
<div id="msg"></div>
<button id="btn">DROP</button>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xf4e3c1);
scene.fog=new THREE.Fog(0xf4e3c1,18,42);
const cam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,100);
const ren=new THREE.WebGLRenderer({antialias:true});
ren.setSize(innerWidth,innerHeight);ren.shadowMap.enabled=true;
document.body.appendChild(ren.domElement);
scene.add(new THREE.HemisphereLight(0xfff4e0,0xc98f4e,0.9));
const sun=new THREE.DirectionalLight(0xffffff,0.9);
sun.position.set(6,12,4);sun.castShadow=true;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:0xe8cf9f}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

const H=0.8;let lvl=0,dir=1,axis='x',over=false,falling=[];
let prev={x:0,z:0,w:3,d:3};
const base=new THREE.Mesh(new THREE.BoxGeometry(3,H,3),new THREE.MeshStandardMaterial({color:0xa16207}));
base.position.y=H/2;base.castShadow=base.receiveShadow=true;scene.add(base);
let box=newBox();
function color(l){return new THREE.Color().setHSL(0.07,0.65,0.55-l*0.02);}
function newBox(){
  const m=new THREE.Mesh(new THREE.BoxGeometry(prev.w,H,prev.d),new THREE.MeshStandardMaterial({color:color(lvl)}));
  m.castShadow=m.receiveShadow=true;
  m.position.y=H*1.5+lvl*H;
  if(axis==='x')m.position.z=prev.z;else m.position.x=prev.x;
  scene.add(m);return m;
}
document.getElementById('btn').onclick=drop;
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();drop();}});
addEventListener('pointerdown',e=>{if(e.target.id!=='btn')drop();});
function drop(){
  if(over)return;
  let nx=box.position.x,nz=box.position.z,nw=prev.w,nd=prev.d;
  if(axis==='x'){const dx=box.position.x-prev.x;nw=prev.w-Math.abs(dx);nx=(box.position.x+prev.x)/2+(dx>0?0:0);nx=dx>0?prev.x+ (prev.w-nw)/2+ (nw/2- (prev.w-nw)/2)*0+ (dx/2):prev.x-(prev.w-nw)/2+(0);nx=prev.x+dx/2;
    if(nw<=0.15){return lose();}
    const cut=prev.w-nw;
    if(cut>0.01){const f=new THREE.Mesh(new THREE.BoxGeometry(cut,H,nd),box.material.clone());f.position.set(dx>0?box.position.x+nw/2+cut/2-0:box.position.x-nw/2-cut/2+0,box.position.y,box.position.z);f.castShadow=true;scene.add(f);falling.push({m:f,vx:dx>0?3:-3,vy:0});}
    box.scale.x=nw/prev.w;box.position.x=nx;
  }else{const dz=box.position.z-prev.z;nd=prev.d-Math.abs(dz);nz=prev.z+dz/2;
    if(nd<=0.15){return lose();}
    const cut=prev.d-nd;
    if(cut>0.01){const f=new THREE.Mesh(new THREE.BoxGeometry(nw,H,cut),box.material.clone());f.position.set(box.position.x,box.position.y,dz>0?box.position.z+nd/2+cut/2:box.position.z-nd/2-cut/2);f.castShadow=true;scene.add(f);falling.push({m:f,vz:dz>0?3:-3,vy:0});}
    box.scale.z=nd/prev.d;box.position.z=nz;
  }
  prev={x:nx,z:nz,w:nw,d:nd};lvl++;
  document.getElementById('lvl').textContent=lvl;
  if(lvl>=12){over=true;document.getElementById('msg').textContent='🏆 You win! Tower of 12! Share it!';zkPush('Stack the Dune 3D',1700);return;}
  axis=axis==='x'?'z':'x';box=newBox();
}
function lose(){over=true;falling.push({m:box,vy:0,vx:axis==='x'?dir*4:0,vz:axis==='z'?dir*4:0});document.getElementById('msg').textContent='💥 Fell! Level '+lvl+' - tap to restart';zkPush('Stack the Dune 3D',lvl*100);setTimeout(()=>{addEventListener('pointerdown',()=>location.reload(),{once:true});},500);}
function zkPush(g,s){try{const k='zk_best_'+g;if(s>parseInt(localStorage.getItem(k)||'0'))localStorage.setItem(k,String(s));if(parent&&parent.zkSaveScore)parent.zkSaveScore(g,s);}catch(e){}}
let t=0;
(function loop(){
  requestAnimationFrame(loop);t+=0.016;
  if(!over){
    const range=4.2,speed=2.4+Math.min(lvl*0.12,1.6);
    if(axis==='x')box.position.x=prev.x+Math.sin(t*speed)*range;
    else box.position.z=prev.z+Math.sin(t*speed)*range;
    dir=Math.cos(t*speed)>=0?1:-1;
  }
  falling.forEach(f=>{f.vy-=0.25;f.m.position.y+=f.vy*0.06;if(f.vx)f.m.position.x+=f.vx*0.06;if(f.vz)f.m.position.z+=f.vz*0.06;f.m.rotation.x+=0.02;});
  const ty=lvl*H+4;
  cam.position.set(7,ty+3.5,7);cam.lookAt(0,lvl*H,0);
  ren.render(scene,cam);
})();
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>

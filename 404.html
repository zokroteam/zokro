<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Over? Play Again! | Zokro</title>
<meta name="description" content="Lost in the desert? Jump back into Zokro free games!">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0714">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;color:#faf6ea;background:#0a0714;text-align:center;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:34px 16px 50px;background-image:radial-gradient(900px 420px at 50% -5%,#7c3aed44,transparent),radial-gradient(600px 320px at 85% 20%,#f5c45122,transparent)}
.logo{height:52px;filter:drop-shadow(0 6px 18px #f5c45144)}
.go{font-size:clamp(60px,13vw,148px);font-weight:900;letter-spacing:6px;line-height:1;margin:14px 0 0;position:relative;color:#fff;text-shadow:0 0 34px #f5c45155;animation:float 3.2s ease-in-out infinite}
.go::before,.go::after{content:attr(data-t);position:absolute;inset:0;overflow:hidden}
.go::before{color:#ff3b6b;z-index:-1;animation:gl1 2.6s infinite steps(2)}
.go::after{color:#22d3ee;z-index:-2;animation:gl2 3.4s infinite steps(2)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes gl1{0%,90%{transform:none;opacity:.65;clip-path:inset(0 0 60% 0)}92%{transform:translate(-7px,3px);clip-path:inset(10% 0 40% 0)}95%{transform:translate(6px,-3px);clip-path:inset(50% 0 10% 0)}100%{transform:none;clip-path:inset(0 0 60% 0)}}
@keyframes gl2{0%,88%{transform:none;opacity:.65;clip-path:inset(60% 0 0 0)}91%{transform:translate(6px,2px);clip-path:inset(20% 0 50% 0)}96%{transform:translate(-5px,-3px);clip-path:inset(60% 0 5% 0)}100%{transform:none;clip-path:inset(60% 0 0 0)}}
.sub{color:#efe6d2;margin:8px 0 2px;font-size:16px}
.subar{color:#b8aed6;margin:0 0 20px;font-size:14px}
.btn{display:inline-block;background:linear-gradient(90deg,#f5c451,#ff8a3d);color:#1a1000!important;font-weight:900;text-decoration:none;border-radius:26px;padding:14px 40px;font-size:16px;box-shadow:0 12px 34px #f5c45144;transition:.15s}
.btn:hover{transform:translateY(-2px)}
.ghost{display:inline-block;color:#faf6ea;text-decoration:none;border:1px solid #f5c45155;border-radius:26px;padding:13px 30px;font-size:15px;margin-inline-start:8px}
.mid{color:#b8aed6;margin:30px 0 14px;font-size:14px}
.pop{display:grid;grid-template-columns:repeat(3,minmax(150px,210px));gap:14px;justify-content:center;width:100%;max-width:700px}
.pop a{background:#171226;border:1px solid #f5c45133;border-radius:18px;overflow:hidden;text-decoration:none;color:#fff;transition:.15s}
.pop a:hover{transform:translateY(-4px);border-color:#f5c451}
.pop .art{height:110px;display:flex;align-items:center;justify-content:center;font-size:52px}
.a1{background:conic-gradient(from 40deg,#0e7490,#22d3ee,#0e7490)}.a2{background:conic-gradient(from 40deg,#92400e,#f59e0b,#92400e)}.a3{background:conic-gradient(from 40deg,#065f46,#34d399,#065f46)}
.pop b{display:block;padding:10px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px}
.row button{background:#ffffff0d;color:#fff;border:1px solid #f5c45133;border-radius:22px;padding:11px 24px;font-size:14px;font-weight:700;cursor:pointer}
.row button:hover{border-color:#f5c451;color:#f5c451}
@media(max-width:560px){.pop{grid-template-columns:1fr 1fr}.pop .art{height:90px}}
</style>
</head>
<body>
<img class="logo" src="/assets/logo.svg" alt="Zokro">
<div class="go" data-t="GAME OVER">GAME OVER</div>
<p class="sub">Oops, you've reached a dead end! The page you're looking for doesn't exist.</p>
<p class="subar">الصفحة دي تاهت في الصحرا 🏜️ ارجع العب!</p>
<div>
<a class="btn" href="/en/">▶ Go back home</a>
<a class="ghost" href="/ar/">🇪🇬 عربي</a>
</div>
<p class="mid">...or head back to the action:</p>
<div class="row">
<button onclick="location.href='/en/#games'">✨ New games</button>
<button onclick="location.href='/ar/#games'">🎮 ألعاب جديدة</button>
<button onclick="location.href='/en/leaderboard.html'">🔥 Trending</button>
</div>
</body>
</html>

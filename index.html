<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zokro - Free Online Games | ألعاب مجانية</title>
<meta name="description" content="Zokro: free online games in English and Arabic. Choose your language and play instantly.">
<link rel="canonical" href="https://zokro.fun/">
<meta name="theme-color" content="#0a0714">
<style>body{font-family:system-ui;background:#10122b;color:#fff;text-align:center;padding:60px 20px}a{display:block;max-width:320px;margin:12px auto;padding:16px;border-radius:14px;background:#1e2247;border:1px solid #2c3170;color:#fff;text-decoration:none;font-size:20px}a:hover{border-color:#f5c451}#splash{position:fixed;inset:0;background:#10122b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:99}#splash img{height:76px;animation:pulse 1.2s ease-in-out infinite;filter:drop-shadow(0 8px 24px #f5c45144)}@keyframes pulse{50%{transform:scale(1.08)}}.spin{width:46px;height:46px;border-radius:50%;border:4px solid #2c3170;border-top-color:#f5c451;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}#splash p{color:#b8aed6;font-size:14px;margin:0}</style>
<script>
function go(p){try{localStorage.setItem('zk_lang',p);}catch(e){}location.replace(p);}
try{
  var saved=null;try{saved=localStorage.getItem('zk_lang');}catch(e){}
  if(saved==='ar/'||saved==='en/'){location.replace(saved);}
  else{
    var done=false;
    function pick(p){if(done)return;done=true;location.replace(p);}
    try{
      fetch('https://ipapi.co/json/').then(function(r){return r.json();}).then(function(j){
        var c=(j&&j.country_code)||'';
        var AR=['EG','SA','AE','QA','KW','BH','OM','JO','LB','SY','IQ','YE','MA','DZ','TN','LY','SD','MR','PS'];
        if(AR.indexOf(c)>=0)pick('ar/');else browserLang();
      }).catch(browserLang);
    }catch(e){browserLang();}
    setTimeout(browserLang,2500);
    function browserLang(){var l='';try{l=(navigator.language||'en').toLowerCase();}catch(e){}if(l.indexOf('ar')===0)pick('ar/');else pick('en/');}
  }
}catch(e){location.replace('en/');}
</script>
</head>
<body>
<noscript><style>#splash{display:none}</style></noscript>
<div id="splash"><img src="assets/logo.svg" alt="Zokro"><div class="spin"></div><p>Loading… • جاري التحميل…</p></div>
<h1>🎮 ZOKRO</h1>
<p>Choose your language • اختار لغتك</p>
<a href="ar/">🇪🇬 عربي</a>
<a href="en/">🇺🇸 English</a>
</body>
</html>
